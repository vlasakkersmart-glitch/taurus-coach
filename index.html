<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Taurus Coach">
<meta name="theme-color" content="#0b1026">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Taurus Coach</title>
<style>
:root{--bg:#0b1026;--bg2:#11141b;--card:rgba(255,255,255,.055);--card2:rgba(255,255,255,.09);--line:rgba(255,255,255,.08);--txt:#f2f4f8;--mut:#8d95a5;--acc:#a5b4fc;--acc2:#f9a8d4;--teal:#4fd1c5;--ok:#39d98a;--warn:#ffcc4d;--bad:#ff5f6d;--r:18px;
--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:radial-gradient(1200px 600px at 80% -10%,rgba(165,180,252,.16),transparent 60%),radial-gradient(900px 500px at -10% 30%,rgba(79,209,197,.07),transparent 60%),var(--bg);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#app{max-width:760px;margin:0 auto;padding:calc(var(--st) + 10px) 14px calc(var(--sb) + 96px)}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 2px 14px}
.hdr h1{font-size:28px;letter-spacing:-.02em;margin:0;font-weight:750}
.hdr .sub{color:var(--mut);font-size:13px}
.ibtn{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.ibtn svg{width:20px;height:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.card h2{font-size:17px;margin:0 0 10px;font-weight:700;letter-spacing:-.01em}
.card h3{font-size:14px;margin:12px 0 6px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.mut{color:var(--mut)}.small{font-size:12.5px}.tiny{font-size:11px}
.row{display:flex;align-items:center;gap:8px}.wrap{flex-wrap:wrap}.sp{justify-content:space-between}.grow{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-weight:650}
.btn.pri{background:linear-gradient(135deg,var(--acc),#818cf8);border:0;color:#fff;box-shadow:0 8px 24px rgba(99,102,241,.28)}
.btn.ok{background:var(--ok);color:#06210f;border:0}
.btn.bad{background:rgba(255,95,109,.15);color:var(--bad);border-color:rgba(255,95,109,.3)}
.btn.sm{min-height:36px;padding:0 12px;border-radius:11px;font-size:13.5px}
.btn.full{width:100%}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:12px;color:#d6dae3;white-space:nowrap}
.chip.acc{background:rgba(165,180,252,.15);border-color:rgba(165,180,252,.35);color:var(--acc2)}
.chip.ok{background:rgba(57,217,138,.12);border-color:rgba(57,217,138,.3);color:var(--ok)}
.chip.warn{background:rgba(255,204,77,.12);border-color:rgba(255,204,77,.3);color:var(--warn)}
.chip.bad{background:rgba(255,95,109,.12);border-color:rgba(255,95,109,.3);color:var(--bad)}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.hscroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.hscroll::-webkit-scrollbar{display:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:10px}
.stat b{display:block;font-size:20px;letter-spacing:-.02em}.stat span{font-size:11.5px;color:var(--mut)}
.list>*{border-top:1px solid var(--line);padding:11px 0}.list>*:first-child{border-top:0}
.li{display:flex;align-items:center;gap:10px;width:100%;text-align:left}
.num{min-width:36px;height:28px;border-radius:9px;background:rgba(165,180,252,.14);color:var(--acc2);display:grid;place-items:center;font-weight:700;font-size:12.5px}
input.f,select.f,textarea.f{font-size:16px;width:100%;min-height:44px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:0 12px;outline:none}
textarea.f{padding:10px 12px;min-height:80px}
input.f:focus,select.f:focus,textarea.f:focus{border-color:rgba(165,180,252,.6)}
select.f{appearance:none;-webkit-appearance:none}
label.lb{display:block;font-size:12.5px;color:var(--mut);margin:10px 0 5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;min-height:36px;border-radius:10px;font-size:13.5px;color:var(--mut);font-weight:600}
.seg button.on{background:var(--card2);color:var(--txt);box-shadow:0 1px 0 rgba(255,255,255,.06) inset}
/* tabbar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:8px 10px calc(var(--sb) + 8px);background:rgba(11,16,38,.78);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid var(--line)}
.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--mut);padding:4px 0;font-weight:600}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--acc)}
.tabs .dot{position:absolute;margin-left:18px;margin-top:-2px;width:8px;height:8px;border-radius:50%;background:var(--ok)}
/* sophie */
.soph{display:flex;gap:12px;align-items:flex-start}
.av{flex:none;width:46px;height:46px;border-radius:50%;background:conic-gradient(from 200deg,#a5b4fc,#f9a8d4,#4fd1c5,#a5b4fc);padding:2px;position:relative}
.av>div{width:100%;height:100%;border-radius:50%;background:#151821;display:grid;place-items:center;font-weight:800;font-size:18px;color:var(--acc2)}
.av.talk::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid rgba(165,180,252,.5);animation:pulse 1.4s infinite}
@keyframes pulse{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.25);opacity:0}}
.bubble{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:10px 12px}
.me .bubble{border-radius:16px 4px 16px 16px;background:rgba(165,180,252,.14);border-color:rgba(165,180,252,.25)}
.chat{display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow:auto;padding:2px}
.chat .me{align-self:flex-end;max-width:85%}.chat .so{max-width:92%}
/* workout */
.wk-h{position:sticky;top:0;z-index:30;margin:-10px -14px 10px;padding:calc(var(--st) + 8px) 14px 10px;background:rgba(11,16,38,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}
.timebig{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;color:var(--acc2)}
.ex{padding:14px 12px}
.ex .tt{display:flex;align-items:flex-start;gap:10px}
.ex .nm{font-weight:700;font-size:16.5px;letter-spacing:-.01em}
.change{margin:10px 0 4px;padding:10px 12px;border-radius:12px;background:rgba(255,204,77,.1);border:1px solid rgba(255,204,77,.3);color:#ffe29a;font-size:13.5px}
.same{margin:10px 0 4px;padding:8px 12px;border-radius:12px;background:rgba(57,217,138,.08);border:1px solid rgba(57,217,138,.22);color:#9ff0c6;font-size:13px}
.advice{margin:8px 0 2px;font-size:13px;color:#cfd4de}
.tbl{margin-top:10px}
.rirq{grid-column:1/-1;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);padding:2px 0 4px}.rirq span{flex:1}.rirq button{min-width:34px;height:30px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:inherit;font-weight:700}
.tr{display:grid;grid-template-columns:34px 1fr 128px 58px 48px;align-items:center;gap:6px;padding:4px 0}
.tr.h{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;padding-bottom:2px}
.tr.done .cell,.tr.done input{background:rgba(57,217,138,.1)!important}
.setno{height:38px;border-radius:10px;background:var(--card2);font-weight:700;font-size:13px}
.setno.t-w{color:var(--warn)}.setno.t-d{color:var(--teal)}.setno.t-f{color:var(--bad)}
.prev{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kg{display:flex;align-items:center;gap:2px}
.kg button{width:32px;height:40px;border-radius:9px;background:var(--card2);font-size:18px;font-weight:600}
.tr input{width:100%;height:40px;text-align:center;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.06);outline:none;font-weight:700;font-size:16px;padding:0}
.tr input:focus{border-color:var(--acc)}
.chk{height:40px;border-radius:10px;background:var(--card2);display:grid;place-items:center}
.chk svg{width:20px;height:20px;opacity:.55}
.tr.done .chk{background:var(--ok)}.tr.done .chk svg{opacity:1;color:#052a14}
.rinfo{grid-column:2/-1;font-size:11.5px;color:var(--mut);margin-top:-2px}
.restbar{position:fixed;left:10px;right:10px;bottom:calc(var(--sb) + 76px);z-index:45;max-width:740px;margin:0 auto;border-radius:18px;padding:10px 12px;background:rgba(24,27,36,.92);border:1px solid rgba(165,180,252,.35);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.restbar .t{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;min-width:74px}
.restbar .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--acc);border-radius:3px}
/* sheet */
.sheetbg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.sheet{width:100%;max-width:760px;max-height:92vh;overflow:auto;background:#12151c;border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:10px 16px calc(var(--sb) + 18px);animation:up .22s cubic-bezier(.2,.8,.2,1)}
.sheettop{position:sticky;top:-10px;z-index:5;display:flex;justify-content:flex-end;align-items:center;margin:-10px -16px 6px;padding:8px 12px 6px;background:#12151c;border-radius:22px 22px 0 0}.sheettop .grab{position:absolute;left:50%;top:8px;transform:translateX(-50%);margin:0}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin:2px auto 12px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--st) + 12px);z-index:80;background:rgba(28,32,42,.96);border:1px solid var(--line);padding:10px 14px;border-radius:14px;max-width:92vw;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:fade .2s}
.banner{padding:10px 12px;border-radius:12px;font-size:13px;margin-bottom:12px}
.banner.warn{background:rgba(255,204,77,.1);border:1px solid rgba(255,204,77,.3);color:#ffe29a}
.banner.info{background:rgba(79,209,197,.08);border:1px solid rgba(79,209,197,.25);color:#b6f0ea}
.dial{display:flex;gap:6px}.dial button{flex:1;height:40px;border-radius:11px;background:var(--card2);font-weight:700;color:var(--mut)}.dial button.on{background:var(--acc);color:#fff}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal div{aspect-ratio:1;display:grid;place-items:center;border-radius:10px;font-size:13px;background:rgba(255,255,255,.03)}
.cal .h{background:none;color:var(--mut);font-size:11px;aspect-ratio:auto;padding:4px 0}
.cal .d1{background:rgba(165,180,252,.25);color:#fff;font-weight:700}.cal .d2{background:rgba(165,180,252,.55);color:#fff;font-weight:700}
.cal .tod{outline:1px solid var(--acc)}
.cal .ref{background:rgba(79,209,197,.18)}
.imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.imgs img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cmp img{width:100%;border-radius:12px}
.tblx{width:100%;border-collapse:collapse;font-size:12.5px}.tblx td,.tblx th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
.pausedov{position:fixed;inset:0;z-index:55;background:rgba(5,6,9,.75);backdrop-filter:blur(6px);display:grid;place-items:center;text-align:center}
.anim{border-radius:14px;border:1px dashed rgba(255,255,255,.18);padding:14px;text-align:center;background:rgba(255,255,255,.03)}
svg.chart text{fill:#8d95a5;font-size:10px}
.hm-legend{height:8px;border-radius:4px;background:linear-gradient(90deg,rgba(165,180,252,.12),rgba(165,180,252,1))}
@media (min-width:700px){.stats{grid-template-columns:repeat(6,1fr)}}

/* ---- Stijl 2: glas ---- */
:root{--bg:#0b1026;--card:rgba(255,255,255,.085);--card2:rgba(255,255,255,.13);--line:rgba(255,255,255,.14);--mut:#a9b0d0;--acc:#a5b4fc;--acc2:#f9a8d4;--r:22px}
body{background:radial-gradient(700px 520px at 12% -6%,rgba(79,70,229,.75),transparent 62%),radial-gradient(640px 520px at 105% 62%,rgba(219,39,119,.42),transparent 60%),radial-gradient(500px 400px at 40% 110%,rgba(56,189,248,.18),transparent 60%),#0b1026;background-attachment:fixed}
.card{background:rgba(255,255,255,.085);border:1px solid rgba(255,255,255,.14);border-radius:22px;backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%);box-shadow:0 10px 30px rgba(5,8,30,.25)}
.btn{border-radius:16px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);transition:transform .12s ease,background .2s}
.btn:active{transform:scale(.97)}
.btn.pri{background:#fff;color:#1e1b4b;border:0;box-shadow:0 8px 26px rgba(99,102,241,.35)}
.chip.on{background:#fff;color:#1e1b4b;border-color:#fff}
.num{background:rgba(165,180,252,.16);color:#c7d2fe}
.hdr h1{font-weight:800}
.ibtn{border-radius:50%;background:rgba(255,255,255,.12)}
.tabs{background:rgba(15,18,48,.55)!important;backdrop-filter:blur(26px) saturate(160%)!important;-webkit-backdrop-filter:blur(26px) saturate(160%)!important;border-top:1px solid rgba(255,255,255,.12)!important}
.tabs button.on{color:#fff}.tabs button.on svg{filter:drop-shadow(0 0 8px rgba(165,180,252,.9))}
#app>*{animation:fadeup .28s ease both}@keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ring-hero{display:flex;align-items:center;gap:16px}
.soph-hi{display:flex;align-items:center;gap:12px;margin:0 2px 14px}
.soph-hi .av{flex:none}
.restdone{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(11,16,38,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:flash 1s ease-in-out infinite alternate}
@keyframes flash{from{background:rgba(79,70,229,.55)}to{background:rgba(219,39,119,.45)}}
.restdone .box{text-align:center;padding:30px}.restdone .big{font-size:44px;font-weight:800;letter-spacing:-.02em}
.motiv.card{background:rgba(30,27,80,.94)!important}
.motiv{position:fixed;left:12px;right:12px;bottom:calc(var(--sb) + 86px);z-index:70;max-width:560px;margin:0 auto;animation:pop .35s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:90}
</style>
</head>

/* =========================================================

   Lagen: DATA (Taurus-database) · STORE (IndexedDB) · ENGINE

   · UI (views). Animatielaag: ANIM-registry (fase 4).

[25,'Lying Hip Rotation','Liggende heuprotatie','benen','off',0,'F',0,'heup','buik','v','voet'],
[26,'Single Leg Lying Hip Rotation','Liggende heuprotatie, één been','benen','off',0,'F',1,'heup','','v','voet'],
[27,'Seated Single Leg Press','Zittende beenpers, één been','benen','bottom',0,'F',1,'quads','billen','v','arm'],

/* Instructies uit de Taurus Ultra Force Trainingsanleitung (DE), vertaald: [beginhouding, uitvoering, tips] */
const MAN={
1:['Stevig voor het toestel staan. Houd de onderste handgrepen op schouderhoogte.','Buig je knieën tot je dijen parallel aan de vloer zijn. Kort vasthouden en terug naar de beginhouding.','Zak met je billen naar achteren (knieën in lijn met je tenen). Gewicht over de hele voet, romp de hele oefening recht, knieën niet volledig strekken.'],
2:['In uitvalspas voor het toestel. De onderste handgrepen op schouderhoogte.','Buig je knie tot je voorste dij parallel aan de vloer is. Kort vasthouden en terug.','Gewicht op de voorste voet. Rug recht. Voorste knie achter je tenen. Beide kanten.'],
3:['Heupbreed voor het toestel staan, handgrepen op schouderhoogte.','Stap naar achteren in een uitvalspas en zak tot je voorste dij parallel aan de vloer is.','Gewicht op de voorste voet. Rug recht. Voorste knie achter je tenen. Beide kanten.'],
4:['Zit op het toestel en klem je benen tussen de rollen van de beenmodule.','Strek je knieën tot ze nog licht gebogen zijn. Kort vasthouden en terug.','Knieholtes ter hoogte van het draaipunt. Benen niet helemaal strekken. Spanning de hele oefening vasthouden.'],
5:['Zit op het toestel en klem één been tussen de rollen van de beenmodule.','Strek je been tot de knie nog licht gebogen is. Kort vasthouden en terug.','Rechtop zitten. Knieholte ter hoogte van het draaipunt. Niet helemaal strekken. Spanning houden.'],
6:['Rug naar het toestel. Buig voorover en pak de onderste handgrepen tussen je benen.','Kom omhoog en strek je heupen. Sta rechtop en druk de handgrepen richting je heupen.','Armen en benen gestrekt. Beweging komt uit rug en heup. Niet door de knieën. Rug en nek recht.'],
7:['Sta voor het toestel en pak de lat-stang van onderen. Buig door je knieën en houd je rug recht.','Strek heupen en rug. Breng de stang met gestrekte armen tot heuphoogte. Kort vasthouden en laten zakken.','Armen, rug en nek recht. Bij het zakken heupen naar achteren en geen holle rug.'],
8:['Met je gezicht naar het toestel. Eén dij drukt tegen de bovenste rol van de beenmodule; haak de enkel van hetzelfde been achter de onderste rol.','Buig je knie tot je onderbeen parallel aan de vloer is. Kort vasthouden en laten zakken.','Romp licht voorover. Been niet volledig strekken.'],
9:['Met je gezicht naar het toestel, onderste handgrepen met gestrekte armen. Voeten parallel, tenen naar het toestel.','Kom op je tenen en verplaats je gewicht naar de bal van je voet. Kort vasthouden en terug.','Armen en benen gestrekt. Buik- en rugspieren aanspannen. Rechtop staan.'],
10:['Met je gezicht naar het toestel, onderste handgrepen vast. Tenen iets naar buiten.','Kom op je tenen. Kort vasthouden en terug.','Armen en benen gestrekt. Buik- en rugspieren aanspannen. Rechtop staan.'],
11:['Met je gezicht naar het toestel, onderste handgrepen vast. Tenen iets naar binnen.','Kom op je tenen. Kort vasthouden en terug.','Armen en benen gestrekt. Buik- en rugspieren aanspannen. Rechtop staan.'],
12:['Met je gezicht naar het toestel, steun met je armen op het rugkussen. Eén voet in de voetlus.','Breng het gestrekte been via heupstrekking naar achteren. Kort vasthouden en terug.','Been gestrekt houden. Buik- en rugspieren aanspannen voor stabiliteit.'],
13:['Met je gezicht naar het toestel, handen op het rugkussen. Eén voet in de voetlus, been gebogen.','Strek je been naar achteren. Kort vasthouden en terug.','Armen gestrekt. Romp beweegt niet mee. Beide kanten.'],
14:['Rug naar het toestel, voetlus om één voet. Handen in je zij.','Til je dij op tot hij parallel aan de vloer is. Kort vasthouden en terug.','Romp blijft rechtop. Buik- en rugspieren aanspannen.'],
15:['Met je gezicht naar het toestel, steun met je armen op het rugkussen. Voet in de voetlus, been gebogen.','Strek je heup en duw je voet naar achteren. Kort vasthouden en terug.','Knie blijft gebogen. Beide kanten.'],
16:['Zijwaarts naast het toestel, buitenste voet in de voetlus. Steun met je arm op het toestel.','Beweeg je been opzij, tenen naar voren. Kort vasthouden en terug.','Been gestrekt. Alleen zijwaarts bewegen, niet naar voren of achteren. Romp rechtop.'],
17:['Zijwaarts naast het toestel, voetlus om de binnenste voet. Steun met je arm op het toestel.','Breng de binnenste voet langs je standbeen. Kort vasthouden en terug.','Werkende voet iets voor de standvoet. Rechte beweging, geen uitwijken. Romp rechtop.'],
18:['Op de vloer liggen, één voet in de voetlus. Gestrekt been verticaal omhoog. Handen aan het frame.','Druk het gestrekte been via heupstrekking naar de vloer. Kort vasthouden en terug.','Been blijft gestrekt. Rug en heup op de vloer. Beide kanten.'],
19:['Op de vloer liggen, voetlussen om beide voeten. Benen ca. 10 cm optillen, handen aan het frame.','Benen zijwaarts openen, kort vasthouden en weer samenbrengen.','Benen gestrekt en ca. 10 cm boven de vloer. Rug en bekken op de vloer.'],
20:['Op de vloer, beide voeten in de voetlussen. Benen ca. 10 cm optillen, handen aan het frame.','Eén been zijwaarts openen, kort vasthouden en terug.','Benen gestrekt en ca. 10 cm boven de vloer. Rug en bekken op de vloer.'],
21:['Op de vloer, beide voeten in de voetlussen, benen opgetrokken. Handen aan het frame.','Strek je benen naar voren. Kort vasthouden en terug.','Knieën op heuphoogte. Tenen omhoog. Rug en heup op de vloer.'],
22:['Op de vloer liggen, voetlus om één voet. Vasthouden aan het frame. Been gebogen.','Duw je voet naar voren zonder het been helemaal te strekken. Kort vasthouden en terug.','Knie op heuphoogte. Tenen naar je toe. Rug en heup op de vloer.'],
23:['Op de vloer, beide voetlussen om. Eén been verticaal omhoog, het andere naar voren gestrekt. Handen aan het frame.','Druk het gestrekte been naar de vloer en til tegelijk het andere op. Afwisselend als een schaar.','Benen gestrekt. Rug en heup op de vloer.'],
24:['Op je rug, beide voeten in de voetlussen. Benen gestrekt en iets van de vloer. Handen aan het frame.','Druk het ene been naar de vloer en til het andere ca. 30 cm op. Afwisselend.','Benen gestrekt. Rug en heup op de vloer. Benen raken de vloer niet.'],
25:['Op je rug, beide voeten in de voetlussen. Benen gestrekt en iets van de vloer. Vasthouden aan het frame.','Open je benen zijwaarts en breng ze in een cirkel omhoog tot heuphoogte. In tegengestelde richting terug.','Benen gestrekt. Rug en bekken blijven op de vloer.'],
26:['Op je rug, beide voeten in de voetlussen. Benen gestrekt en iets van de vloer.','Eén been zijwaarts openen en in een cirkel tot heuphoogte brengen. In tegengestelde richting terug.','Been gestrekt. Rug en bekken op de vloer. Beide kanten.'],
27:['Zittend één been in de voetlus tot zithoogte optillen. Andere voet op de vloer.','Duw je voet naar voren zonder het been helemaal te strekken. Kort vasthouden en terug.','Rechtop, buik en rug aanspannen. Tenen naar je toe. Beide kanten.'],
28:['Zijwaarts op het toestel. Buitenste been in de voetlus en naar voren gestrekt.','Duw het been zijwaarts van het toestel weg, tenen omhoog. Kort vasthouden en terug.','Rechtop zitten. Steun met je vrije been en armen.'],
29:['Zittend, been met voetlus zijwaarts gestrekt.','Breng het been naar voren. Kort vasthouden en terug.','Rechtop zitten. Tenen omhoog. Beide kanten.'],
30:['Zijwaarts op het toestel. Buitenste voet in de voetlus, been naar voren gestrekt, tenen naar binnen.','Draai je enkel tegen de weerstand naar buiten. Kort vasthouden en terug.','Steun met je andere been en je handen. Beide kanten.'],
31:['Zijwaarts op het toestel. Binnenste voet in de voetlus, been gestrekt, tenen naar buiten.','Draai je enkel naar binnen tot je tenen naar binnen wijzen. Kort vasthouden en terug.','Steun met je andere been en je handen. Beide kanten.'],
32:['Zittend de handgrepen vast, armen 90° gebogen. Handpalmen naar beneden, kabels lopen onder je armen.','Strek je ellebogen en duw je armen recht naar voren. Kort vasthouden en terug.','Ellebogen op schouderhoogte. Polsen recht. Ellebogen niet volledig strekken.'],
33:['Zittend één handgreep vast, arm 90° gebogen. Handpalm naar beneden, kabel onder je arm.','Strek je arm recht naar voren. Kort vasthouden en terug.','Elleboog op schouderhoogte. Pols recht. Niet volledig strekken.'],
34:['Zittend de handgrepen vast, armen 90° gebogen. Kabels lopen óver je armen.','Strek je armen naar voren en omhoog. Kort vasthouden en terug.','Handgrepen eindigen op hoofdhoogte. Polsen recht. Armen niet volledig strekken.'],
35:['Zittend één handgreep vast, arm 90° gebogen. Handpalm naar beneden, kabel boven je arm.','Strek je arm naar voren en omhoog. Kort vasthouden en terug.','Handgreep eindigt op hoofdhoogte. Niet volledig strekken. Beide kanten.'],
36:['Zittend de handgrepen met licht gebogen armen naast je schouders. Handpalmen naar voren.','Breng je licht gebogen armen voor je borst samen. Kort vasthouden en terug.','Armen blijven licht gebogen. Rechtop zitten, voeten op de vloer. Langzaam bewegen.'],
37:['Zittend één handgreep met licht gebogen arm naast je schouder. Handpalm naar voren.','Breng je arm naar het midden van je borst. Kort vasthouden en terug.','Arm licht gebogen. Rechtop zitten; stabiliseer met je voeten en vrije hand.'],
38:['Zittend de handgrepen met licht gebogen armen naast je schouders. Handpalmen naar voren.','Breng je armen naar voren en omhoog samen. Kort vasthouden en terug.','Armen licht gebogen. Polsen niet knikken. Rechtop zitten.'],
39:['Zittend één handgreep met licht gebogen arm naast je schouder.','Breng je arm naar voren en omhoog. Kort vasthouden en terug.','Arm licht gebogen. Pols niet knikken. Rechtop zitten, niet uitwijken.'],
40:['Zittend je bekken naar voren schuiven, schouders tegen de rugleuning. Handgrepen bovenhands, armen 90°, ellebogen op schouderhoogte.','Druk je armen naar voren en omlaag. Kort vasthouden en terug.','Handen tot heuphoogte. Polsen recht. Rug recht. Niet volledig strekken.'],
41:['Zittend handgrepen in 90°, handpalmen naar elkaar, duimen omhoog. Kabels onder je armen.','Strek je ellebogen en duw je handen naar voren, ellebogen dicht langs je lichaam.','Handen voor je samenbrengen. Armen, ellebogen en polsen in één lijn.'],
42:['Zit met je gezicht naar het toestel. Pak de lat-stang breed vast. Leun licht achterover.','Buig je ellebogen en trek de stang naar je borst. Kort vasthouden en terug.','Blijf licht achterover leunen. Rug recht. Schouderbladen naar elkaar.'],
43:['Zit op het toestel en pak de lat-stang breed vast, duimen naar binnen.','Trek je ellebogen omlaag en breng de stang naar je borst. Kort vasthouden en terug.','Rug tegen het kussen. Geen holle rug. Ellebogen zijwaarts omlaag.'],
44:['Zit met je gezicht naar het toestel. Pak één bovenste handgreep. Leun iets achterover.','Buig je elleboog en trek richting de vloer. Kort vasthouden en terug.','Blijf achterover leunen. Rug recht. Steun met je andere hand op de rugleuning.'],
45:['Zit met je gezicht naar het toestel. Pak beide bovenste handgrepen, duimen naar buiten, handpalmen naar je toe. Leun licht achterover.','Buig je ellebogen en trek de handgrepen naar je borst. Kort vasthouden en terug.','Blijf achterover leunen. Rug recht. Geen holle rug.'],
46:['Zit met je gezicht naar het toestel. Pak één bovenste handgreep onderhands. Leun licht achterover.','Buig je elleboog en trek de handgreep naar je borst. Kort vasthouden en terug.','Blijf achterover leunen. Rug recht. Beide kanten.'],
47:['Zit met je gezicht naar het toestel. Pak beide bovenste handgrepen, handpalmen naar elkaar. Leun licht achterover.','Buig je ellebogen naar achteren en trek je handen naar je borst. Kort vasthouden en terug.','Blijf achterover leunen. Rug recht. Geen holle rug.'],
48:['Zit met je gezicht naar het toestel. Pak één bovenste handgreep, handpalm naar binnen.','Buig je elleboog naar achteren en trek je hand naar je borst. Kort vasthouden en terug.','Blijf achterover leunen. Rug recht. Steun met je vrije hand.'],
49:['Zit op het toestel met je rug tegen de leuning. Pak de bovenste handgrepen met gestrekte armen, duimen naar binnen.','Trek je gestrekte armen naar voren en omlaag tot buikhoogte. Kort vasthouden en terug.','Armen gestrekt houden, ellebogen niet buigen. Rechtop zitten.'],
50:['Zit op het toestel met je rug tegen de leuning. Pak één bovenste handgreep met gestrekte arm.','Trek je arm naar voren en omlaag tot buikhoogte. Kort vasthouden en terug.','Arm gestrekt. Rechtop zitten. Beide kanten.'],
51:['Zit op het toestel en pak beide bovenste handgrepen met gestrekte armen, handpalmen naar buiten.','Trek je gestrekte armen zijwaarts omlaag tot buikhoogte. Kort vasthouden en terug.','Armen gestrekt, ellebogen niet buigen. Rechtop zitten. Buik en rug aanspannen.'],
52:['Zit op het toestel en pak één bovenste handgreep met gestrekte arm, handpalm naar buiten.','Trek je arm zijwaarts omlaag tot buikhoogte. Kort vasthouden en terug.','Arm gestrekt. Rechtop zitten. Beide kanten.'],
53:['Met je gezicht naar het toestel, knieën licht gebogen en je knieschijven tegen de bovenste rol van de beenmodule. Handgrepen met duimen omhoog.','Buig je ellebogen, trek je handen naar je buik en knijp je schouderbladen samen. Kort vasthouden en terug.','Ellebogen dicht langs je lichaam. Buik- en rugspieren aanspannen, rechtop staan.'],
54:['Als #53, met één handgreep, duim omhoog.','Trek je hand langs je lichaam naar je buik. Kort vasthouden en terug.','Elleboog bij je lichaam. Rechtop. Buik en rug aanspannen.'],
55:['Als #53, handgrepen met duimen naar binnen, handpalmen naar beneden.','Buig je ellebogen en trek je handen naar je buik. Kort vasthouden en terug.','Ellebogen bij je lichaam. Schouderbladen samen. Rechtop.'],
56:['Als #55, met één handgreep.','Buig je elleboog en trek je hand naar je buik. Kort vasthouden en terug.','Elleboog dicht langs je lichaam. Rechtop. Beide kanten.'],
57:['Als #53, handgrepen met duimen naar buiten, handpalmen omhoog.','Buig je ellebogen en trek je handen naar je buik. Kort vasthouden en terug.','Ellebogen dicht langs je lichaam. Rechtop.'],
58:['Als #57, met één handgreep.','Buig je elleboog en trek je hand naar je buik. Kort vasthouden en terug.','Elleboog dicht langs je lichaam. Rechtop. Beide kanten.'],
59:['Met je gezicht naar het toestel. Pak de lat-stang breed met gestrekte armen, handpalmen naar beneden.','Duw de stang met gestrekte armen naar je heupen. Kort vasthouden en terug.','Armen gestrekt. Polsen niet knikken. Rechtop.'],
60:['Zit op het toestel, rug tegen de leuning. Handgrepen op schouderhoogte, ellebogen 90°. Duimen naar binnen, handpalmen naar voren.','Strek je armen boven je hoofd. Kort vasthouden en terug.','Strek in een boog tot je handen elkaar bijna raken. Ellebogen en polsen in lijn met je schouders. Ellebogen niet onder schouderhoogte.'],
61:['Als #60, met één handgreep.','Strek je arm boven je hoofd. Kort vasthouden en terug.','Elleboog en pols in lijn met je schouder. Elleboog niet onder schouderhoogte. Beide kanten.'],
62:['Met je gezicht naar het toestel, stevig staan. Pak de lat-stang van onderen, duimen naar binnen.','Trek met gestrekte armen je schouders omhoog. Kort vasthouden en terug.','Rechtop blijven. Armen gestrekt. Knieën licht gebogen.'],
63:['Stevig voor het toestel. Pak de lat-stang smal op heuphoogte, duimen naar binnen.','Trek de stang richting je borst; ellebogen gaan omhoog. Kort vasthouden en terug.','Rechtop blijven. Ellebogen iets boven schouderhoogte.'],
64:['Rug naar het toestel, handgrepen naast je lichaam bovenhands, duimen naar binnen. Armen gestrekt.','Til je gestrekte armen naar voren tot schouderhoogte. Kort vasthouden en terug.','Armen en polsen gestrekt. Knieën licht gebogen. Buik en rug aanspannen.'],
65:['Als #64, met één handgreep.','Til je gestrekte arm naar voren tot schouderhoogte. Kort vasthouden en terug.','Arm en pols gestrekt. Knieën licht gebogen. Beide kanten.'],
66:['Rug naar het toestel, onderste handgrepen vast. Armen naast je lichaam, duimen naar voren.','Til je licht gebogen armen zijwaarts op. Kort vasthouden en terug.','Tot schouderhoogte of iets hoger. Ellebogen en polsen recht. Rechtop blijven.'],
67:['Als #66, met één handgreep.','Til je licht gebogen arm zijwaarts op. Kort vasthouden en terug.','Tot schouderhoogte of iets hoger. Elleboog en pols recht. Rechtop.'],
68:['Stevig staan met je gezicht naar het toestel. Beide handgrepen met gestrekte armen op heuphoogte. Knieën licht gebogen.','Til je ellebogen zijwaarts op en buig ze. Trek je armen naar achteren en omhoog en knijp je schouderbladen samen. Kort vasthouden en terug.','Ellebogen iets achter je schouders. Ellebogen 90°. Niet boven schouderhoogte.'],
69:['Als #68, met één handgreep.','Til je elleboog zijwaarts op en trek je arm naar achteren en omhoog. Kort vasthouden en terug.','Ellebogen iets achter je schouder, niet boven schouderhoogte. Beide kanten.'],
70:['Stevig staan met je gezicht naar het toestel. Kruis de kabels en houd de handgrepen op heuphoogte, duimen omhoog, armen licht gebogen.','Trek je licht gebogen armen op borsthoogte naar opzij. Kort vasthouden en terug.','Tot je ellebogen op schouderhoogte zijn. Armen licht gebogen.'],
71:['Zit op het toestel en pak de onderste handgrepen bovenhands. Armen gestrekt naast je lichaam.','Til je gestrekte armen voor je lichaam tot iets boven schouderhoogte. Kort vasthouden en terug.','Ellebogen en polsen gestrekt. Rechtop zitten.'],
72:['Als #71, met één handgreep.','Til je gestrekte arm tot iets boven schouderhoogte. Kort vasthouden en terug.','Elleboog en pols gestrekt. Stabiel zitten.'],
73:['Zit op het toestel en pak de onderste handgrepen, duimen naar voren. Armen gestrekt naast je lichaam.','Til je gestrekte armen zijwaarts omhoog. Kort vasthouden en terug.','Tot schouderhoogte of iets hoger. Rechtop zitten. Buik en rug aanspannen.'],
74:['Als #73, met één handgreep.','Til je gestrekte arm zijwaarts op; stabiliseer met je vrije hand. Kort vasthouden en terug.','Tot iets boven schouderhoogte. Beide kanten.'],
75:['Zijwaarts voor het toestel. Handgreep in je buitenste hand, duim omhoog, elleboog 90°. Steun met je vrije arm op het toestel.','Draai je arm naar buiten, elleboog blijft tegen je lichaam. Kort vasthouden en terug.','Elleboog en bovenarm tegen je lichaam. Romp stil.'],
76:['Zijwaarts voor het toestel. Handgreep in je binnenste hand, duim omhoog, elleboog 90°. Vrije hand in je zij.','Breng je hand voor je lichaam, elleboog blijft vast. Kort vasthouden en terug.','Elleboog en bovenarm tegen je lichaam. Romp stil.'],
77:['Met je gezicht naar het toestel. Handgrepen op borsthoogte, ellebogen zijwaarts, onderarmen 90°, bovenhandse greep.','Draai in je schouders en breng je handen boven je ellebogen; ellebogen blijven op hun plek. Kort vasthouden en terug.','Ellebogen op schouderhoogte. Polsen recht. Buik aanspannen.'],
78:['Met je gezicht naar het toestel. Handgrepen met gestrekte armen op heuphoogte voor je, handpalmen naar binnen.','Trek je gestrekte armen naar achteren, achter je lichaam. Kort vasthouden en terug.','Ellebogen gestrekt. Romp niet voorover laten kantelen. Knieën licht gebogen.'],
79:['Zijwaarts voor het toestel. Handgreep in je buitenste hand, duim omhoog, arm gestrekt voor je. Steun met je vrije arm.','Draai je schouder naar buiten en trek de gestrekte arm diagonaal langs je lichaam. Kort vasthouden en terug.','Arm gestrekt. Romp stabiel. Beide kanten.'],
80:['Zijwaarts voor het toestel. Handgreep in je binnenste hand, duim omhoog, arm gestrekt voor je. Vrije hand in je zij.','Draai je schouder naar binnen en trek de arm diagonaal langs je lichaam. Kort vasthouden en terug.','Elleboog en pols gestrekt. Romp stabiel. Beide kanten.'],
81:['Rug naar het toestel, handgrepen onderhands, duimen naar buiten. Armen gestrekt naast je lichaam.','Buig je armen en breng de handgrepen tot borsthoogte. Kort vasthouden en terug.','Ellebogen bij je lichaam en niet naar voren laten zwaaien. Romp stabiel.'],
82:['Als #81, met één handgreep.','Buig je arm en breng de handgreep tot borsthoogte. Kort vasthouden en terug.','Elleboog bij je lichaam. Beide kanten.'],
83:['Rug naar het toestel, beide handgrepen met gestrekte armen, duimen omhoog.','Buig je armen en breng de handgrepen tot borsthoogte. Kort vasthouden en terug.','Ellebogen bij je lichaam, niet naar voren zwaaien. Romp stabiel.'],
84:['Als #83, met één handgreep.','Buig je arm en breng de handgreep tot borsthoogte. Kort vasthouden en terug.','Elleboog bij je lichaam. Beide kanten.'],
85:['Rug naar het toestel, handgrepen bovenhands, duimen naar binnen. Armen gestrekt naast je lichaam.','Buig je armen en breng de handgrepen tot borsthoogte. Kort vasthouden en terug.','Ellebogen bij je lichaam. Romp stabiel.'],
86:['Als #85, met één handgreep.','Buig je arm en breng de handgreep tot borsthoogte. Kort vasthouden en terug.','Elleboog bij je lichaam, pols stabiel. Beide kanten.'],
87:['Met je gezicht naar het toestel, curl-stang onderhands. Stevig staan, knieën licht gebogen.','Buig je armen; niet verder dan 45°. Kort vasthouden en terug.','Ellebogen bij je lichaam, niet naar voren.'],
88:['Met je gezicht naar het toestel, curl-stang bovenhands. Stevig staan, knieën licht gebogen.','Buig je armen; niet verder dan 45°. Kort vasthouden en terug.','Ellebogen bij je lichaam, niet naar voren.'],
89:['Zit op het toestel, romp recht voorover. Steun je elleboog op je dij en pak de handgreep onderhands.','Buig je arm en breng je hand naar je borst; niet verder dan 45°. Kort vasthouden en terug.','Romp recht. Elleboog blijft op je knie. Steun met je vrije hand.'],
90:['Zit op het toestel, romp recht voorover. Onderarmen op je dijen, handgrepen onderhands.','Trek je polsen omhoog. Kort vasthouden en terug.','Rug recht. Onderarmen blijven liggen; beweging alleen uit de pols.'],
91:['Zit op het toestel, romp recht voorover. Onderarmen op je dijen, handgrepen bovenhands (duimen naar binnen).','Trek je polsen omhoog. Kort vasthouden en terug.','Rug recht. Onderarmen blijven liggen.'],
92:['Zit op het toestel. Beide handgrepen met gebogen ellebogen achter je hoofd; ellebogen op hoofdhoogte.','Strek je armen en duw je handen omhoog; ellebogen blijven op hun plek. Kort vasthouden en terug.','Ellebogen niet naar buiten laten kantelen. Polsen recht. Niet volledig strekken. Rechtop zitten.'],
93:['Als #92, met één handgreep.','Strek je arm en duw je hand omhoog; elleboog blijft op zijn plek. Kort vasthouden en terug.','Elleboog niet naar buiten. Pols recht. Beide kanten.'],
94:['Stevig met je gezicht naar het toestel. Lat-stang bovenhands, ellebogen 90°.','Strek je armen; ellebogen en bovenarmen blijven tegen je lichaam. Kort vasthouden en terug.','Ellebogen bij je lichaam en niet volledig strekken. Buik en rug aanspannen.'],
95:['Als #94, lat-stang onderhands (duimen naar buiten).','Strek je armen; ellebogen blijven tegen je lichaam. Kort vasthouden en terug.','Ellebogen bij je lichaam, niet volledig strekken.'],
96:['Stevig met je gezicht naar het toestel. Handgrepen bovenhands (duimen naar binnen), ellebogen 90°.','Strek je armen; ellebogen en bovenarmen blijven tegen je lichaam. Kort vasthouden en terug.','Ellebogen bij je lichaam, niet volledig strekken.'],
97:['Als #96, met één handgreep.','Strek je arm; elleboog blijft tegen je lichaam. Kort vasthouden en terug.','Elleboog bij je lichaam, niet volledig strekken. Beide kanten.'],
98:['Als #97, handgreep onderhands (duim naar buiten).','Strek je arm; elleboog blijft tegen je lichaam. Kort vasthouden en terug.','Elleboog bij je lichaam. Knieën licht gebogen.'],
99:['Met je gezicht naar het toestel, steun met één arm op de rugleuning, romp licht voorover. Andere hand pakt de handgreep, elleboog 90° (bovenhands).','Strek je arm naar beneden en achteren tot in lijn met je lichaam. Kort vasthouden en terug.','Bovenarm en elleboog tegen je lichaam. Pols recht. Beide kanten.'],
100:['Als #99, onderhandse greep (duim naar buiten).','Strek je arm naar beneden en achteren tot in lijn met je lichaam. Kort vasthouden en terug.','Bovenarm tegen je lichaam. Beide kanten.'],
101:['Met je gezicht naar het toestel, beide handgrepen bovenhands, armen 90° gebogen.','Strek je armen naar beneden en achteren tot in lijn met je lichaam. Kort vasthouden en terug.','Bovenarmen tegen je lichaam. Polsen recht. Niet volledig strekken.'],
102:['Als #101, onderhandse greep (duimen naar buiten).','Strek je armen naar beneden en achteren. Kort vasthouden en terug.','Bovenarmen tegen je lichaam. Polsen recht.'],
103:['Rug naar het toestel, armen op taillehoogte. Kabels lopen onder je armen, ellebogen gebogen naar achteren.','Strek je armen en duw je handen omlaag, armen dicht langs je lichaam. Kort vasthouden en terug.','Armen langs je lichaam. Bij het duwen iets naar voren leunen.'],
104:['Als #103, met één handgreep.','Strek je arm en duw je hand omlaag. Kort vasthouden en terug.','Arm langs je lichaam. Rechtop, buik en rug aanspannen. Beide kanten.'],
105:['Zit rechtop op het toestel. Buig één elleboog en pak de tegenoverliggende handgreep op schouderhoogte.','Strek je onderarm voor je lichaam uit. Kort vasthouden en terug.','Elleboog op schouderhoogte. Pols recht. Steun met je vrije hand op de zitting. Beide kanten.'],
106:['Zit op het toestel. Handgrepen voor je lichaam op schouderhoogte, ellebogen naar voren, handpalmen naar je toe.','Rol je romp op en trek je borst richting je heupen. Kort vasthouden en terug.','Beweging komt niet uit je armen. Focus op je buikspieren. Nek in lijn met je wervelkolom. Rustig blijven ademen.'],
107:['Als #106.','Rol je romp op en trek je elleboog diagonaal naar de tegenoverliggende knie. Kort vasthouden en terug.','Beweging komt niet uit je armen. Nek in lijn met je wervelkolom. Beide kanten.'],
108:['Zijwaarts naast het toestel. Eén handgreep met gestrekte armen in beide handen; romp gedraaid naar het toestel. Knieën licht gebogen.','Draai je romp met gestrekte armen tegen de weerstand naar buiten. Kort vasthouden en terug.','Armen niet boven schouderhoogte; beweging niet uit je armen. Onderrug recht. Beide kanten.'],
109:['Stevig zijwaarts naast het toestel. Handgreep bovenhands in je binnenste hand, vrije hand in je zij.','Buig je romp met gestrekte arm tegen de weerstand naar buiten. Kort vasthouden en terug.','Arm gestrekt naast je lichaam. Niet naar voren of achteren uitwijken. Buik en rug aanspannen.'],
110:['Zit met je gezicht naar het toestel. Handgrepen tegen je borst, ellebogen bij je lichaam.','Leun tegen de weerstand naar achteren (rug strekken); handen blijven tegen je borst. Kort vasthouden en terug.','Borst omhoog, wervelkolom recht bij het achteroverleunen. Rustig ademen.']
};

function optimizeOrder(items,start=startCfg()){

  for(let j=0;j<n;j++){const rem=nums.filter((_,k)=>k!==j);const t=transition({...start},nums[j]);const s=(1<<j)*n+j;dp[s]=t.cost*CW()+orderPenalty(nums[j],rem)+0.15*j;cfg[s]=t.next}
  for(let m=1;m<N;m++)for(let l=0;l<n;l++){const s=m*n+l;if(dp[s]===Infinity)continue;
    for(let j=0;j<n;j++){if(m&(1<<j))continue;const nm=m|(1<<j);const rem=[];for(let k=0;k<n;k++)if(!(nm&(1<<k)))rem.push(nums[k]);

function parseLog(t){let m=t.match(/(\d{1,3})\s*(?:herhalingen|herhaling|reps)\s*(?:met|op|bij)?\s*(\d{1,3}(?:[.,]\d{1,2})?)\s*(?:kilo|kg)/);if(m)return{reps:+m[1],w:num(m[2])};m=t.match(/(\d{1,3}(?:[.,]\d{1,2})?)\s*(?:kilo|kg)\s*(?:en|met|x|keer)?\s*(\d{1,3})\s*(?:herhalingen|reps|keer)/);if(m)return{w:num(m[1]),reps:+m[2]};return null}

function newSet(adv,j,prevSets){return{type:'n',w:adv&&adv.w!=null?adv.w:null,wR:null,reps:null,ph:adv?adv.reps:null,rir:null,done:false}}
function startWorkout(key,opts={}){if(S.active){toast('Er loopt al een training. Rond die eerst af of hervat hem.');S.ui.tab='train';render();return}
  const recov=rec();let items=opts.items||buildItems(key,{minutes:opts.minutes,recov});
  const w={id:uid(),date:localISO(),name:opts.name||(S.plans[key]?S.plans[key].name:'Training')+(opts.minutes?` (${opts.minutes} min)`:''),planKey:key&&S.plans[key]?key:null,source:'app',startedAt:Date.now(),pausedMs:0,pausedAt:null,checkin:recov,exercises:[]};
  S.active=w;

    return{ex:it.ex,item:{sets:it.sets,lo:it.lo,hi:it.hi,rest:it.rest,rir:it.rir??2,note:it.note||''},adv,note:'',superset:false,sets:Array.from({length:it.sets},(_,j)=>cp&&cp[j]?{type:cp[j].type||'n',w:cp[j].w,wR:cp[j].wR??null,reps:null,ph:cp[j].reps,rir:null,done:false}:newSet(adv,j))}});
  S.ui.tab='train';save();render();wake(true);audio();
  const first=w.exercises[0];if(first){const l=soLine(first.ex);speak((recov&&recov.low?'Je herstel is matig, dus we houden het vandaag rustiger. ':'')+'We beginnen met '+exName(first.ex)+'. '+(l||''))}}
function markDone(i,j,val){const a=S.active;const e=a.exercises[i],s=e.sets[j];
  if(val){if(s.reps==null&&s.ph!=null)s.reps=s.ph;if(s.w==null){toast('Vul eerst de weerstand in.');return false}if(!s.reps){toast('Vul het aantal herhalingen in.');return false}
    const max=+S.profile.maxPerSide||125;if(s.w>max){toast(`Let op: ${fmtKg(s.w)} is meer dan je ingestelde maximum (${fmtKg(max)} per kant).`)}s.done=true;s.skip=false;
    const lastOfEx=e.sets.every(x=>x.done||x.skip);
    const nx=a.exercises[i+1];
    if(e.superset&&nx&&!lastOfEx){/* superset: geen rust tussen A en B */}else if(s.type!=='w'||true){startRest(s.type==='w'?45:(pref(e.ex).rest||e.item.rest||90))}
    if(lastOfEx){const at=e.sets.filter(x=>x.done&&x.type!=='w');const hit=at.length&&at.every(x=>x.reps>=e.item.hi);
      let msg=hit?'Je hebt bij alle sets je doel gehaald. Volgende keer verhogen we de weerstand.':'';
      if(nx){const t=transition(cfgAt(i),nx.ex);if(!t.changes.length&&!t.unknown)msg+=(msg?' ':'')+'Je kunt alles laten zitten. '+exName(nx.ex)+' gebruikt dezelfde instelling.';else if(t.changes.length)msg+=(msg?' ':'')+'Voor '+exName(nx.ex)+': '+t.changes.join(', ').toLowerCase()+'.'}
      else msg+=(msg?' ':'')+'Dat was de laatste oefening. Rond je training af.';
      if(msg){toast(msg,5000);speak(msg)}}
  }else{s.done=false}
  save();updCard(i);return true}
function cfgAt(i){const a=S.active;let cur=startCfg();for(let k=0;k<=i;k++)cur=transition(cur,a.exercises[k].ex).next;return cur}

function finishWorkout(){const a=S.active;if(!a)return;const end=Date.now();const paused=a.pausedMs+(a.pausedAt?end-a.pausedAt:0);
  const w={id:a.id,date:a.date,start:a.startedAt,end,name:a.name,planKey:a.planKey,source:'app',test:!!a.test,durationMin:Math.max(1,Math.round((end-a.startedAt-paused)/6e4)),checkin:a.checkin,notes:a.notes||'',
    exercises:a.exercises.map(e=>({ex:e.ex,note:e.note,superset:e.superset,sets:e.sets.filter(s=>s.done).map(s=>({type:s.type,w:s.w,wR:s.wR,reps:s.reps,rir:s.rir,done:true}))})).filter(e=>e.sets.length)};
  S.active=null;S.rest=null;wake(false);if(!w.exercises.length){save();render();toast('Training verwijderd (geen voltooide sets).');return}
  S.workouts.push(w);recomputePRs();save();snapshot('training');render();renderRest();showSummary(w.id);if((w.prs||[]).length&&!w.test)setTimeout(confetti,350);if(window.HEALTH){HEALTH.pushState();HEALTH.haBackup(true);if(!w.test)setTimeout(()=>HEALTH.linkWorkout(w),60000)}}
function summaryText(w){const lines=[],better=[],worse=[];
  for(const e of w.exercises){if(e.ex==null)continue;const prev=sessionsFor(e.ex,{ref:false,exclude:w.id}).filter(s=>s.w.date<w.date)[0];const cur=e.sets.filter(s=>s.type!=='w');if(!cur.length)continue;
    const cb=Math.max(...cur.map(s=>e1rm(eff(s),s.reps)));if(prev){const pb=Math.max(...prev.sets.map(s=>e1rm(eff(s),s.reps)));if(cb>pb*1.01)better.push(exName(e.ex));else if(cb<pb*0.97)worse.push(exName(e.ex))}}

  const next=w.exercises.filter(e=>e.ex!=null).map(e=>{const it=e.item||{sets:e.sets.length,lo:8,hi:12};const pl=S.plans[w.planKey];const pi=pl&&pl.items.find(x=>x.ex===e.ex);return{ex:e.ex,a:advise(pi||{ex:e.ex,sets:e.sets.length,lo:8,hi:12})}}).filter(x=>x.a.kind==='up');

function coachState(){const ws=S.workouts.filter(real).sort((a,b)=>b.date.localeCompare(a.date));const last=ws[0];const wk=wkStart();const done=ws.filter(w=>new Date(w.date)>=wk).length;const goal=+S.profile.freq||3;
  const today=localISO().slice(0,10);const y=new Date();y.setDate(y.getDate()-1);const yest=localISO(y).slice(0,10);const k=nextPlanKey();const P=S.plans[k];const est=Math.round(estimateSec(buildItems(k))/60);
  const lastD=last?last.date.slice(0,10):null;const gap=last?Math.floor((new Date(today)-new Date(lastD))/864e5):null;const dow=(new Date().getDay()+6)%7;const daysLeft=7-dow;
  const trainedToday=lastD===today;const due=!trainedToday&&done<goal&&(lastD!==yest||goal-done>=daysLeft);
  let msg;if(trainedToday)msg='Vandaag al getraind. Goed bezig!';else if(done>=goal)msg=`Weekdoel gehaald (${done}/${goal}). Een extra training mag, rust ook.`;

  const P=Array.from({length:140},()=>({x:c.width/2,y:c.height*.35,vx:(Math.random()-.5)*26,vy:-Math.random()*26-6,r:Math.random()*7+4,c:cols[Math.random()*5|0],a:Math.random()*6}));let f=0;

    let nb=0;(d.body||[]).forEach(b=>{const ex=S.body.find(x=>x.date===b.date);if(!ex){S.body.push(b);nb++}else{let ch=0;for(const k in b)if(ex[k]==null&&b[k]!=null){ex[k]=b[k];ch=1}nb+=ch}});(d.photos||[]).forEach(p=>{if(!S.photos.some(x=>x.id===p.id))S.photos.push(p)});if(d.exPrefs)S.exPrefs={...d.exPrefs,...S.exPrefs};const keys=new Set(S.workouts.map(w=>w.importKey).filter(Boolean));S.workouts=S.workouts.filter((w,i,a)=>!w.importKey||a.findIndex(x=>x.importKey===w.importKey)===i);recomputePRs();save();if(d.health&&window.HEALTH){try{await HEALTH.importData(d.health)}catch(e){}}render();toast(`Geïmporteerd: ${n} trainingen${nb?' en '+nb+' metingen':''} toegevoegd. Vooraf is een snapshot gemaakt.`,4500);return}

    createProfile({name,skiMode:g('goal')==='ski',height:num(g('height'))||180,weight:num(g('weight'))||80,targetWeight:num(g('weight'))||80,goal:g('goal')||'spier',level:g('level')||'gemiddeld',freq:+g('freq')||3,model:g('model')||'TF-UF-PRO',maxPerSide:g('model')==='TF-UF'?100:110});toast('Welkom, '+name+'!');break}
  case'welkomimp':pickFile('welkom','application/json,.json');break;
  case'reload':location.reload();break;
  case'testvoice':speak('Hoi '+S.profile.name+', ik ben Sophie. Nog één set en dan zijn je schouders klaar.',true);break;
  }});
document.addEventListener('submit',ev=>{const f=ev.target.closest('[data-a="askf"]');if(!f)return;ev.preventDefault();const i=$('#askin');const q=i.value;i.value='';ask(q)});
function onField(ev){const t=ev.target;const f=t.dataset&&t.dataset.f;if(!f)return;const d=t.dataset,A=S.active,I=+d.i,J=+d.j;
  switch(f){
  case'w':A.exercises[I].sets[J].w=num(t.value);save();break;
  case'reps':{const v=parseInt(t.value);A.exercises[I].sets[J].reps=isNaN(v)?null:v;save();break}
  case'wR':A.exercises[I].sets[J].wR=num(t.value);save();if(ev.type==='change')updCard(I);break;
  case'exnote':A.exercises[I].note=t.value;save();if(ev.type==='change')updCard(I);break;
  case'exQ':S.ui.exQ=t.value;if(ev.type==='input'){clearTimeout(window._qt);window._qt=setTimeout(()=>{render();const el=document.querySelector('[data-f="exQ"]');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}},250)}break;
  case'setup':if(ev.type!=='change')break;{const s=S.setup||{seat:null,leg:null,acc:null,pl:'',pr:''};const v=t.value;s[d.k]=v===''?null:(d.k==='leg'?+v:v);S.setup=(s.seat||s.leg!=null||s.acc)?s:null;save();render();break}
  case'onlySetup':S.ui.onlySetup=t.checked;render();break;
  case'ov':if(ev.type!=='change')break;{const p=pref(+d.n);const o=p.ov||(p.ov={});const v=t.value;o[d.k]=d.k==='leg'?(v===''?null:+v):v;save();if(S.ui.tab!=='train')render();else render();break}
  case'exrest':if(ev.type!=='change')break;pref(+d.n).rest=parseInt(t.value)||null;save();break;
  case'progEx':S.ui.progEx=+t.value;render();break;
  case'wkex':if(ev.type!=='change')break;{const w=S.workouts.find(x=>x.id===d.id);w.exercises[I].ex=t.value?+t.value:null;recomputePRs();save();break}
  case'wkset':if(ev.type!=='change')break;{const w=S.workouts.find(x=>x.id===d.id);const s=w.exercises[I].sets[J];if(d.k==='w')s.w=num(t.value);else s.reps=parseInt(t.value)||null;recomputePRs();save();break}
  case'planname':S.plans[S.ui.planKey].name=t.value;save();break;
  case'planit':if(ev.type!=='change')break;S.plans[S.ui.planKey].items[I][d.k]=parseInt(t.value)||0;save();render();break;
  case'planadd':if(ev.type!=='change'||!t.value)break;S.plans[S.ui.planKey].items.push({ex:+t.value,sets:3,lo:8,hi:12,rest:90,rir:2});save();render();break;
  case'prof':if(ev.type!=='change')break;{const k=d.k;S.profile[k]=['name','level','model','skiDate','skiLabel','restSound'].includes(k)?t.value:num(t.value);save();break}
  case'skimodeck':S.profile.skiMode=t.checked;save();break;
  case'voice':S.profile.voice=t.checked;save();break;
  case'motivck':S.profile.motiv=t.checked;save();break;
  case'impunit':IMP.unit=t.value;openImportPreview();break;
  case'impwm':IMP.wmode=t.value;openImportPreview();break;
  case'impex':{const v=t.value;IMP.exmap[d.n]={...IMP.exmap[d.n],ex:v==='skip'||v==='ext'?v:+v,conf:'handmatig'};openImportPreview();break}
  case'impcol':IMP.map[d.k]=+t.value;buildExMap();openImportPreview();break;
  }}
document.addEventListener('input',onField);document.addEventListener('change',onField);
$('#file').addEventListener('change',e=>onFile(e.target.files[0]));
function openAddEx(){sheet(`<h2>Oefening toevoegen</h2><input class="f" placeholder="Zoek…" id="addq" style="margin-bottom:8px"><div class="list" id="addl">${EX.filter(e=>e.status!=='x'&&!pref(e.num).avoid).map(e=>`<button class="li" data-a="doadd" data-n="${e.num}" data-s="${esc((e.nl+' '+e.en+' '+e.num).toLowerCase())}"><span class="num">${e.num}</span><div class="grow">${esc(e.nl)}<div class="small mut">${e.prim.map(m=>MUS[m]).join(', ')}</div></div></button>`).join('')}</div>`);
  $('#addq').addEventListener('input',e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('#addl .li').forEach(b=>b.style.display=b.dataset.s.includes(q)?'':'none')})}
function openQuick(k,m){const it=buildItems(k,{minutes:m,recov:rec()});sheet(`<h2>Snelle training</h2><div class="dial" style="margin:8px 0">${[20,30,45].map(v=>`<button class="${v===m?'on':''}" data-a="quick2" data-k="${k}" data-m="${v}">${v} min</button>`).join('')}</div>
  <div class="small mut">${esc(S.plans[k].name)} · ${changePlan(it.map(i=>i.ex)).total} ombouwacties · ca. ${Math.round(estimateSec(it)/60)} min</div><div class="list" style="margin-top:6px">${it.map(i=>`<div class="li"><span class="num">${i.ex}</span><div class="grow">${esc(exName(i.ex))}<div class="small mut">${i.sets} × ${i.lo}–${i.hi} · rust ${i.rest}s</div></div></div>`).join('')}</div><button class="btn pri full" style="margin-top:12px" data-a="quickgo" data-k="${k}" data-m="${m}">Start</button>`)}
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-a="quick2"]');if(t)openQuick(t.dataset.k,+t.dataset.m)});

/* ---------------- BOOT ---------------- */
function icon(){try{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');const g=x.createLinearGradient(0,0,180,180);g.addColorStop(0,'#a5b4fc');g.addColorStop(1,'#db2777');x.fillStyle='#0b1026';x.fillRect(0,0,180,180);x.fillStyle=g;x.beginPath();x.arc(90,90,72,0,7);x.fill();x.fillStyle='#fff';x.font='bold 92px -apple-system,system-ui,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('T',90,96);const l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL();document.head.appendChild(l)}catch(e){}}
function registerSW(){try{if(!('serviceWorker' in navigator)||location.protocol!=='https:'||window.self!==window.top)return;let rl=0;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!rl&&!S.active){rl=1;location.reload()}});navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(reg=>{if(reg.waiting&&navigator.serviceWorker.controller&&!S.active)reg.waiting.postMessage('skip');reg.update().catch(()=>{});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{})});reg.addEventListener('updatefound',()=>{const nw=reg.installing;nw&&nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller){if(!S.active){toast('App wordt bijgewerkt…',3000);nw.postMessage('skip')}else{window._swUpdate=true;toast('Nieuwe versie klaar; wordt geladen na je training.',5000)}}})})}).catch(()=>{})}catch(e){}}
if(typeof window!=='undefined'&&!window.__TEST__){registerSW();load().then(()=>{if(S.ui.tab==='instellingen')S.ui.tab='vandaag';if(!META.current)S.ui.tab='welkom';if(S.active)S.ui.tab='train';render();if(S.active&&!S.active.pausedAt)wake(true);if(window.HEALTH){HEALTH.autoSync();HEALTH.pushState();HEALTH.haBackup(false)}if(window.VOED)setTimeout(()=>VOED.autoSync&&VOED.autoSync(),2000);setTimeout(maybeMotivate,1200)})}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&typeof maybeMotivate==='function'&&!window.__TEST__)setTimeout(maybeMotivate,800)});
</script>
